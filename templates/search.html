<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNP</title>

    <style>

        body {
            /* Tar bild */
            background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20230928/pngtree-a-graph-showing-graphing-statistics-image_13300948.jpg');
            
            /* Gör så att bilden täcker hela skärmen utan att upprepas */
            background-size: cover;
            background-repeat: no-repeat;

            /* Sänker opacitet för att det ska se coolare */
            opacity: 0.85;

            /* Centrerar objekterna */
            display: flex;
            flex-direction: column;
            align-items: center;

            height: 100vh;
        }

        h1 {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: azure;
            margin-top: 20px;
        }

        img {
            width: 700px;
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <h1>View a country's GDP growth from 1960 to 2025</h1>

    <!-- Ta emot data från formulär -->
    <form method="POST">
        <input type="text" name="bnp" placeholder="Country: ">
        <input type="submit" value="Send">
    </form>

    <!-- Visar bilden på det utvalda landets BNP-utveckling -->
    {% if image %}
    <img src="{{ url_for('static', filename=image) }}">
    {% endif %}

</body>
</html>
